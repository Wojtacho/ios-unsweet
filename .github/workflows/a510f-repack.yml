name: a510f-repack

# Fast path for boot-args changes: take the kernel of the newest successful
# a510f-xnu run and only rebuild the recovery image (shim, ADT, payload with
# a510f/boot-args.txt). A few minutes instead of a full kernel build.

on:
  workflow_dispatch:
  push:
    branches: [a510f]
    paths:
      - "a510f/boot-args.txt"
      - "a510f/tools/mkadt_a510f.py"
      - "a510f/shim/**"
      - "a510f/build.sh"
      - "tools/sweet-init.S"
      - "tools/mkinit.py"
      - ".github/workflows/a510f-repack.yml"

permissions:
  actions: read
  contents: read

jobs:
  repack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Find the newest successful kernel build
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Newest a510f-xnu run that uploaded a kernel, even if a later job
          # (the boot image, on a broken apt mirror) failed.
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=a510f-xnu-kernel&per_page=1" \
                 --jq '.artifacts[0].workflow_run.id')
          [ -n "$id" ] || { echo "::error::no a510f-xnu kernel artifact"; exit 1; }
          echo "run_id=$id" >> "$GITHUB_OUTPUT"
          echo "kernel from a510f-xnu run $id"

      - uses: actions/download-artifact@v4
        with:
          name: a510f-xnu-kernel
          run-id: ${{ steps.src.outputs.run_id }}
          github-token: ${{ github.token }}
          path: kernel

      - name: Install toolchain
        run: |
          # The runners' Azure Ubuntu mirror hung on 2026-11-11: time-limit apt
          # and fall back to archive.ubuntu.com.
          A='-o Acquire::Retries=3 -o Acquire::http::Timeout=20'
          pk="gcc gcc-aarch64-linux-gnu device-tree-compiler libfdt-dev libssl-dev cpio"
          apt_try() { timeout 300 sudo apt-get update -q $A && timeout 600 sudo apt-get install -y -q $A $pk; }
          if ! apt_try; then
            echo "::warning::Azure Ubuntu mirror failed, switching to archive.ubuntu.com"
            sudo sed -i 's#azure.archive.ubuntu.com#archive.ubuntu.com#g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources || true
            apt_try
          fi

      - name: Build the RAM-disk root (sweet's test init) if rd=md0
        run: |
          if grep -qw 'rd=md0' a510f/boot-args.txt; then
            sudo apt-get install -y -q clang > /dev/null
            # static PID 1: prints to /dev/console, heartbeat every 5 s (tools/sweet-init.S)
            clang -target arm64-apple-ios16.0 -c tools/sweet-init.S -o init.o
            python3 tools/mkinit.py init.o rootfs.bin
            ls -l rootfs.bin
          fi

      - name: Fetch the iPhone X device tree (/product for the ADT)
        env:
          IPSW_URL: https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw
        run: |
          # tools/mkadt.py copies /product (artwork-device-subtype 2436, thin
          # bezel, ...) from Apple's D22AP device tree; without it UIKit's
          # screen bounding path asserts and SpringBoard crash-loops.
          pip3 install -q --break-system-packages pyliblzfse
          python3 tools/remotezip.py "$IPSW_URL" Firmware/all_flash/DeviceTree.d22ap.im4p /tmp/dt
          mkdir -p research/ipsw-x
          python3 tools/im4p_extract.py /tmp/dt/Firmware/all_flash/DeviceTree.d22ap.im4p research/ipsw-x/d22ap.adt
          test -s research/ipsw-x/d22ap.adt

      - name: Build recovery image
        run: |
          set -o pipefail
          f=$(ls kernel/kernel.* | grep -v -e '\.dSYM' -e SHA256 | head -1)
          root=""; [ -f rootfs.bin ] && root=rootfs.bin
          bash a510f/build.sh xnu "$f" "$(head -1 a510f/boot-args.txt)" $root 2>&1 | tee boot.log
          echo "::notice title=repacked::kernel from a510f-xnu run ${{ steps.src.outputs.run_id }}%0Aboot-args: $(head -1 a510f/boot-args.txt)%0Aramdisk root: ${root:-none}%0A$(grep 'recovery.img:' boot.log | cut -c1-200)%0A$(ls -l a510f/out/a510f-xnu-recovery.tar | awk '{print $5" bytes"}')"

      - uses: actions/upload-artifact@v4
        with:
          name: a510f-xnu-recovery
          path: |
            a510f/out/a510f-xnu-recovery.tar
            a510f/out/shim/a510f.adt
          if-no-files-found: error
