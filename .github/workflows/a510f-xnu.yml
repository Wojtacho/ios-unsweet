name: a510f-xnu

# xnu-8796 with sweet's patch set turned into the A510F variant
# (a510f/xnu/make-a510f-variant.sh): 4 KB pages, ARMv8.0, no PAN.
# Same toolchain setup as xnu.yml. Compile errors are also published as
# annotations, since run logs need a GitHub login.

on:
  workflow_dispatch:
    inputs:
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
  push:
    branches: [a510f]
    paths:
      - "a510f/xnu/**"
      - "a510f/shim/**"
      - "a510f/tools/**"
      - "a510f/build.sh"
      - "tools/mkadt.py"
      - "tools/mkpayload.py"
      - "xnu/patches/**"
      - ".github/workflows/a510f-xnu.yml"

concurrency:
  group: a510f-xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: "13.5"
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: SWEET

jobs:
  build:
    # macos-14 runners are retired; xnu.yml chose them for Xcode 15's iig.
    # Intel image: the arm64 macOS runners are short on capacity (jobs were
    # never picked up); clang cross-compiles the arm64 kernel either way.
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script and patches (A510F variant)
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          bash a510f/xnu/make-a510f-variant.sh dxb/patches
          # A510F-only patches, numbered after sweet's
          cp a510f/xnu/patches/*.patch dxb/patches/
          # libfirehose_kernel: add the plain arm64 slice, built for cortex-a53
          bash a510f/xnu/patch-dxb-build.sh dxb

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          echo "::notice title=toolchain::$(sw_vers -productVersion) / available: $(ls -d /Applications/Xcode_*.app | xargs -n1 basename | tr '\n' ' ') / using $(basename "$XC") / $(xcodebuild -version | tr '\n' ' ')"

      - name: Build
        working-directory: dxb
        env:
          MAKEFLAGS: -k
        run: |
          set -o pipefail
          bash build.sh 2>&1 | tee ../build.log

      - name: Report
        if: always()
        run: |
          python3 - <<'EOF'
          import re
          log = open('build.log', errors='replace').read() if __import__('os').path.exists('build.log') else ''
          clean = re.sub(r'\x1b\[[0-9;]*m', '', log)
          errs, seen = [], set()
          for line in clean.splitlines():
              m = re.search(r'([\w./-]+\.(?:c|cpp|h|s|S|hpp)):(\d+):\d+: (?:fatal )?error: (.*)', line)
              if m:
                  key = (m.group(1).split('/xnu/')[-1], m.group(2), m.group(3))
                  if key not in seen:
                      seen.add(key)
                      errs.append(f'{key[0]}:{key[1]}: {key[2]}'[:300])
          other = [l.strip()[:300] for l in clean.splitlines()
                   if re.search(r'(^|\s)(error:|Error \d+|ld: |Undefined symbols|patch.*(failed|does not apply))', l)
                   and 'No syntax errors' not in l][-25:]
          print(f'{len(errs)} distinct compile errors')
          for i in range(0, min(len(errs), 160), 20):
              print(f'::error title=compile errors {i + 1}-{min(i + 20, len(errs))} of {len(errs)}::' + '%0A'.join(errs[i:i + 20]))
          built = __import__('os').path.isdir('dxb/fakeroot/System/Library/Kernels')
          if not errs and other and not built:
              print('::error title=other failures (last lines)::' + '%0A'.join(other))
          tail = [l[:250] for l in clean.splitlines() if l.strip()][-15:]
          print('::notice title=build log tail::' + '%0A'.join(tail))
          EOF
          ls -la dxb/fakeroot/System/Library/Kernels/ 2>/dev/null || echo "no kernel produced"

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          cp build.log out/ 2>/dev/null || true
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) 2>/dev/null || true
          ls -la out
          if ls out/kernel.* >/dev/null 2>&1; then
            f=$(ls out/kernel.* | grep -v '\.dSYM' | head -1)
            echo "::notice title=kernel built::$(basename "$f") $(stat -f %z "$f") bytes%0A$(file "$f" | cut -c1-200)"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a510f-xnu-kernel
          path: out/
          if-no-files-found: warn

  # Instruction check on Linux: the macOS runner is scarce and the scan only
  # needs the kernel file. Fails on anything the SM-A510F's Cortex-A53
  # cannot execute and names the function it is in.
  isa-check:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: a510f-xnu-kernel
          path: kernel

      - name: Check the kernel for instructions the A53 lacks
        run: |
          # numpy from PyPI first (the Ubuntu mirror hung for 20 min on 2026-11-11)
          timeout 300 pip3 install -q --break-system-packages numpy || \
            timeout 600 sudo apt-get install -y -q -o Acquire::Retries=3 -o Acquire::http::Timeout=20 python3-numpy > /dev/null
          python3 -c 'import numpy'
          f=$(ls kernel/kernel.* 2>/dev/null | grep -v -e '\.dSYM' -e SHA256 | head -1 || true)
          [ -n "$f" ] || { echo "::error title=kernel ISA check::no kernel was built"; exit 1; }
          rc=0
          python3 a510f/tools/macho_isa_scan.py "$f" > isa.txt 2>&1 || rc=$?
          cat isa.txt
          level=notice; [ "$rc" = 0 ] || level=error
          echo "::$level title=kernel ISA check (exit $rc) $(basename "$f") $(sha256sum "$f" | cut -c1-16)::$(grep -v '^__' isa.txt | tail -40 | cut -c1-300 | sed ':a;N;$!ba;s/\n/%0A/g')"
          exit $rc

  # Flashable recovery image: A510F boot shim + this kernel as the payload
  # (ADT from a510f/tools/mkadt_a510f.py, boot-args). Only for a kernel that
  # passed the instruction check.
  boot-image:
    needs: isa-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: a510f-xnu-kernel
          path: kernel

      - name: Install toolchain
        run: |
          # The runners' Azure Ubuntu mirror hung on 2026-11-11: time-limit apt
          # and fall back to archive.ubuntu.com.
          A='-o Acquire::Retries=3 -o Acquire::http::Timeout=20'
          pk="gcc gcc-aarch64-linux-gnu device-tree-compiler libfdt-dev libssl-dev cpio"
          apt_try() { timeout 300 sudo apt-get update -q $A && timeout 600 sudo apt-get install -y -q $A $pk; }
          if ! apt_try; then
            echo "::warning::Azure Ubuntu mirror failed, switching to archive.ubuntu.com"
            sudo sed -i 's#azure.archive.ubuntu.com#archive.ubuntu.com#g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources || true
            apt_try
          fi

      # Same image as a510f-repack: boot-args from a510f/boot-args.txt and,
      # with rd=md0, sweet's test init as the RAM-disk root.
      - name: Build the RAM-disk root (sweet's test init) if rd=md0
        run: |
          if grep -qw 'rd=md0' a510f/boot-args.txt; then
            sudo apt-get install -y -q clang > /dev/null
            clang -target arm64-apple-ios16.0 -c tools/sweet-init.S -o init.o
            python3 tools/mkinit.py init.o rootfs.bin
          fi

      - name: Fetch the iPhone 8 Plus device tree (/product, /buttons for the ADT)
        env:
          IPSW_URL: https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-76738/B6C604B4-548E-401F-BBFF-916E3FFDF235/iPhone_5.5_P3_16.7.16_20H392_Restore.ipsw
        run: |
          # a510f/tools/mkadt_a510f.py: identity iPhone10,2 / D21AP, and
          # /product (artwork, screen class) + /buttons (Home button type)
          # from Apple's D21AP device tree. The userland is the 8 Plus IPSW.
          pip3 install -q --break-system-packages pyliblzfse
          python3 tools/remotezip.py "$IPSW_URL" Firmware/all_flash/DeviceTree.d21ap.im4p /tmp/dt
          mkdir -p research/ipsw-8p
          python3 tools/im4p_extract.py /tmp/dt/Firmware/all_flash/DeviceTree.d21ap.im4p research/ipsw-8p/d21ap.adt
          test -s research/ipsw-8p/d21ap.adt

      - name: Build shim + payload recovery image
        run: |
          set -o pipefail
          f=$(ls kernel/kernel.* | grep -v -e '\.dSYM' -e SHA256 | head -1)
          root=""; [ -f rootfs.bin ] && root=rootfs.bin
          bash a510f/build.sh xnu "$f" "$(head -1 a510f/boot-args.txt)" $root 2>&1 | tee boot.log
          echo "::notice title=boot image::boot-args: $(head -1 a510f/boot-args.txt)%0Aramdisk root: ${root:-none}%0A$(grep -E 'recovery.img:' boot.log | tail -2 | cut -c1-200 | sed ':a;N;$!ba;s/\n/%0A/g')%0A$(ls -l a510f/out/a510f-xnu-recovery.tar | awk '{print $5" bytes "$9}')"

      - uses: actions/upload-artifact@v4
        with:
          name: a510f-xnu-recovery
          path: |
            a510f/out/a510f-xnu-recovery.tar
            a510f/out/shim/a510f.adt
          if-no-files-found: error
